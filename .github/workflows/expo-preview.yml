# Publishes the phone app to Expo so it can be opened in the Expo Go app.
# Runs on every push to main that changes app/, or manually from the Actions tab.
# Needs one repository secret: EXPO_TOKEN (an access token from expo.dev).
name: Expo preview (open in Expo Go)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/expo-preview.yml'

permissions:
  contents: write

concurrency:
  group: expo-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check EXPO_TOKEN secret
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add a repository secret named EXPO_TOKEN (create it at https://expo.dev/settings/access-tokens)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Link Expo project (first run only)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" ]; then
            eas init --non-interactive --force
            PID=$(jq -r '.expo.extra.eas.projectId' app.json)
            jq --arg u "https://u.expo.dev/$PID" '.expo.updates.url = $u' app.json > app.json.tmp && mv app.json.tmp app.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link Expo project"
            git push
          fi

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://app-production-97e1.up.railway.app
          MSG: ${{ github.event.head_commit.message || 'Manual update' }}
        run: |
          eas update --branch preview --message "$(echo "$MSG" | head -n1)" --non-interactive --json > ../update.json

      - name: Show QR code
        run: |
          PID=$(jq -r '.expo.extra.eas.projectId' app.json)
          GROUP=$(jq -r '.[0].group' ../update.json)
          QR="https://qr.expo.dev/eas-update?slug=exp&projectId=$PID&groupId=$GROUP"
          {
            echo "## Open in Expo Go"
            echo "Scan this with your phone camera (iPhone) or the Expo Go app (Android):"
            echo ""
            echo "![QR code]($QR)"
            echo ""
            echo "Link: $(curl -s "$QR&format=url")"
          } >> "$GITHUB_STEP_SUMMARY"
